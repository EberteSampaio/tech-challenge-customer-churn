[project]
name = "churn"
version = "0.1.0"
description = "Tech challenge fase 1 - Pós Tech Machine Learning Engineering: Prever churn de clientes"
readme = "README.md"
authors = [
    { name = "Eberte Sampaio", email = "deveberte@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.148.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
notebooks = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev", "notebooks"]