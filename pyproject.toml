[project]
name = "churn"
version = "0.1.0"
description = "Tech challenge fase 1 - Pós Tech Machine Learning Engineering: Prever churn de clientes"
readme = "README.md"
authors = [
    { name = "Eberte Sampaio", email = "deveberte@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"
